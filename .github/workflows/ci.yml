name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      include_manual_browser_tests:
        description: Include the nutrition browser scenario excluded from automatic CI
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go / PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: training
          POSTGRES_PASSWORD: training
          POSTGRES_DB: training
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U training -d training"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://training:training@127.0.0.1:5432/training?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit and PostgreSQL integration tests with race detector
        run: go test -race -count=1 ./...
      - name: Build API and administrator CLI
        run: |
          go build -trimpath -o "$RUNNER_TEMP/bodybuilder-api" .
          go build -trimpath -o "$RUNNER_TEMP/bodybuilder-admin" ./cmd/admin
      - name: Check USDA importer and isolated test helpers
        working-directory: .
        run: |
          python3 scripts/import_usda_foods.py --self-test
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

  frontend:
    name: Frontend / Chromium / WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: training
          POSTGRES_PASSWORD: training
          POSTGRES_DB: training
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U training -d training"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://training:training@127.0.0.1:5432/training?sslmode=disable
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: Install frontend dependencies
        run: npm ci
      - name: Install browser and database client dependencies
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Svelte / TypeScript and client unit tests
        run: |
          npm run check
          npm run test:mock
          npm run test:nutrition
          npm run test:goals
          npm run test:expert
      - name: Fixture UI tests
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/ci-artifacts/mock/development/report
          BODYBUILDER_INCLUDE_MANUAL_BROWSER_TESTS: ${{ inputs.include_manual_browser_tests && '1' || '0' }}
        run: |
          ui_args=()
          if [ "$BODYBUILDER_INCLUDE_MANUAL_BROWSER_TESTS" != "1" ]; then
            ui_args+=(--grep-invert '@manual-ci')
          fi
          npm run test:ui -- "${ui_args[@]}" --output "$RUNNER_TEMP/ci-artifacts/mock/development/results"
      - name: Production PWA tests
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/ci-artifacts/mock/production/report
        run: npm run test:ui:production -- tests/pwa.spec.ts tests/goal-onboarding.spec.ts tests/expert-system.spec.ts tests/program-import.spec.ts --output "$RUNNER_TEMP/ci-artifacts/mock/production/results"
      - name: Build isolated live test API
        working-directory: backend
        env:
          BODYBUILDER_E2E_BIN_DIR: ${{ runner.temp }}/bodybuilder-e2e
        run: |
          mkdir -p "$BODYBUILDER_E2E_BIN_DIR"
          go build -trimpath -o "$BODYBUILDER_E2E_BIN_DIR/bodybuilder-api" .
          go build -trimpath -o "$BODYBUILDER_E2E_BIN_DIR/bodybuilder-admin" ./cmd/admin
      - name: Live API, production nutrition, and offline sync UI tests
        working-directory: .
        env:
          BODYBUILDER_E2E_BIN_DIR: ${{ runner.temp }}/bodybuilder-e2e
        run: python3 scripts/run_live_ui_checks.py --reports-dir "$RUNNER_TEMP/ci-artifacts/live"
      - name: Upload browser reports and isolated API log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-reports
          path: ${{ runner.temp }}/ci-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  ios:
    name: iPhone / Health energy
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Health coverage policy tests
        run: swift test --package-path native/ios --scratch-path "$RUNNER_TEMP/bodybuilder-health-tests"
      - name: Compile unsigned iPhone wrapper
        run: >-
          xcodebuild -project native/ios/BodyBuilder.xcodeproj -target BodyBuilder
          -configuration Debug -sdk iphonesimulator -arch arm64
          SYMROOT="$RUNNER_TEMP/bodybuilder-ios/products" OBJROOT="$RUNNER_TEMP/bodybuilder-ios/objects"
          CODE_SIGNING_ALLOWED=NO build

  docker:
    name: Docker / ${{ matrix.component }}
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build production image
        env:
          BODYBUILDER_DOCKER_CONTEXT: ${{ matrix.component }}
        run: >-
          docker build --file "$BODYBUILDER_DOCKER_CONTEXT/Dockerfile"
          --tag "bodybuilder-$BODYBUILDER_DOCKER_CONTEXT:ci"
          "$BODYBUILDER_DOCKER_CONTEXT"
