services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: training
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - training_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d training"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      PORT: "8081"
      API_HOST: "0.0.0.0"
      DATABASE_URL: postgres://training:training@postgres:5432/training?sslmode=disable
      DB_SCHEMA: training
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      BACKEND_API_URL: http://backend:8081
      ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
volumes:
  training_pgdata:
